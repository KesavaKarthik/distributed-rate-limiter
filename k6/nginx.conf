# Round-robin over the two app instances, so the load test hits the same
# topology the project has argued about since Phase 1: two JVMs with isolated
# heaps sharing exactly one Redis. Balancing here rather than in the k6 script
# keeps the test a client and the load balancing a property of the deployment.

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream apps {
        # max_fails=0 disables passive health checks. With exactly two known-good
        # instances, ejecting one for fail_timeout after a transient blip halves
        # capacity and answers 502 — which shows up in results as application
        # errors that never happened. Measuring the app means the balancer must
        # not invent failures of its own.
        server app1:8080 max_fails=0;
        server app2:8080 max_fails=0;
        # Keep upstream connections alive: without this nginx opens a new TCP
        # connection per request and the handshake shows up in the p99 of every
        # scenario, baseline included, inflating the numbers being compared.
        keepalive 128;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://apps;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
